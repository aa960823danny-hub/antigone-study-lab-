<script>
const DATA={"scenes":[{"title":"The two sisters and the forbidden burial","short":"Two sisters, one choice","phase":"OPENING","minutes":7,"priority":"EXAM CORE","summary":"After the armies of Argos retreat from Thebes, Oedipus's sons, Eteocles and Polynices, have killed each other in battle. Creon, their uncle and the new king, gives Eteocles an honorable burial but forbids anyone to bury or mourn Polynices. The punishment announced is death by stoning. Antigone asks her sister Ismene to help bury Polynices. Ismene refuses because she fears the law and believes they are powerless women under male rule. Antigone chooses to bury him alone, even if it costs her life. She does not want the act kept secret.","zh":"兩兄弟互相戰死；克瑞翁准許安葬保衛城邦的 Eteocles，禁止安葬進攻城邦的 Polynices。Antigone 堅持埋葬，Ismene 因害怕王令而拒絕。","cause":"Creon treats the brothers differently because they fought on opposite sides.","action":"Antigone plans to break his decree; Ismene will not join her.","effect":"The conflict between family/divine duty and civic law is established.","recall":"Why does Ismene refuse, and why does Antigone continue?","quote":"I will bury him myself.","triggers":["Eteocles = defended Thebes","Polynices = attacked Thebes","Ismene refuses","Stoning = initial announced penalty"],"details":["Oedipus is the sisters' father; Jocasta was both Oedipus' mother and wife.","Creon is Antigone and Ismene's uncle.","The brothers killed each other on the same day.","Antigone says she has longer to please the dead than the living."]},{"title":"Victory, the chorus, and Creon’s public decree","short":"Creon chooses the state","phase":"OPENING","minutes":7,"priority":"EXAM CORE","summary":"The chorus of elderly Theban citizens celebrates the victory over Argos and recalls the seven gates of Thebes. Creon announces the principles of his new rule: the safety of the city comes first, and a friend must never be valued above the country. He orders full burial honors for Eteocles, who defended Thebes. Polynices, who attacked his homeland, must remain unburied and become food for birds and dogs. The chorus leader acknowledges Creon's power; guards have already been posted. Creon believes disobedience is dangerous and suspects that money can corrupt people.","zh":"歌隊歌頌底比斯擊退 Argos；克瑞翁公開宣布國家至上、忠臣受褒獎，叛國者 Polynices 不得安葬。","cause":"Creon believes a stable city requires loyalty and obedience.","action":"He proclaims the burial ban before the elders.","effect":"The ban becomes an official political test of loyalty.","recall":"What does Creon value above personal friendship?","quote":"our country is our safety.","triggers":["chorus = old Theban citizens","Creon = new king","Eteocles = patriot","Polynices = traitor in Creon’s eyes"],"details":["The chorus sings of Zeus punishing human pride and the victory of Thebes.","Creon says political character is tested through ruling and making laws.","Creon suspects bribery even before the culprit is known."]},{"title":"The sentry reports a mysterious burial","short":"Dust on the corpse","phase":"RISING CONFLICT","minutes":5,"priority":"HIGH","summary":"A nervous sentry comes to Creon with dangerous news: someone has placed a thin covering of dust over Polynices' body and performed burial rites. There are no footprints or obvious signs of digging, so the guards do not know who did it. The chorus leader wonders whether the gods might be responsible. Creon angrily rejects this idea and accuses discontented citizens of bribing his guards. He threatens the sentry unless the person who buried the body is found. At this point, the person responsible has NOT yet been caught.","zh":"哨兵發現屍體被薄薄的灰塵覆蓋、有人行了葬禮，但還不知道犯人是誰。Creon 誤認為守衛收賄。","cause":"The corpse receives burial rites despite the ban.","action":"The sentry reports the act; Creon demands the culprit.","effect":"The guards uncover the body and return to watch for the person.","recall":"Why is Creon angry at the sentry, and what is still unknown?","quote":"sprinkled some dry dust on the flesh","triggers":["first report = anonymous burial","thin dust, no digging","bribery accusation = Creon’s suspicion","sentry = witness, NOT culprit"],"details":["The corpse is not buried deeply; it has a light cover of road dust.","The guards draw lots to decide who must report to Creon.","The chorus leader suggests the act could be the work of gods."]},{"title":"Antigone is caught and defends unwritten laws","short":"Divine law vs human law","phase":"RISING CONFLICT","minutes":10,"priority":"EXAM CORE","summary":"The guards remove the dust, and a dust storm strikes. When the storm clears, Antigone returns, mourns her brother, covers his body with dust, and pours three libations from a bronze urn. The sentry catches her. In front of Creon she admits the act without denying anything. She knew the public decree, but argues that no mortal king can override the gods' everlasting, unwritten laws. She believes failing to bury her brother would be worse than dying. Creon calls her disobedient, arrogant, and a threat to his authority; he even accuses Ismene of involvement.","zh":"第二次現場埋葬時，Antigone 灑灰、倒下三次奠酒，被抓到後坦承。她主張神明「不成文、永恆的法」高於人間王令。","cause":"The guards uncover Polynices and Antigone returns to honor him.","action":"Antigone openly confesses and defends divine law.","effect":"Creon is determined to punish her and suspects Ismene.","recall":"Which law does Antigone rank higher, and what does she admit?","quote":"the great unwritten, unshakable traditions.","triggers":["three libations = Antigone","I did it = confession","unwritten laws = Antigone","never afraid of death"],"details":["The chorus sings that humans can master many things except death.","Antigone says the gods did not create Creon's decree.","She believes other citizens support her but are afraid to speak.","Creon insists a patriot and a traitor cannot receive equal honors."]},{"title":"Ismene offers to share the blame; Creon condemns Antigone","short":"Claimed guilt is not real guilt","phase":"RISING CONFLICT","minutes":6,"priority":"EXAM CORE","summary":"Ismene is brought in. Although she refused to help earlier, she now says she wants to share the guilt and die with Antigone. Antigone rejects her claim, reminding her that she did not take part in the burial. The sisters' contrast is essential: Ismene chose survival at first; Antigone chose the risk of death. Ismene also tells Creon that Antigone is engaged to his son Haemon. Creon refuses to spare Antigone for the marriage. His final decision here is that Antigone must die, but later he explicitly spares Ismene because her hands are clean.","zh":"Ismene 後來願意分擔罪責，但她沒有實際參與。她提醒 Creon：Antigone 是他兒子 Haemon 的未婚妻；Creon 不為婚約讓步，後來放過 Ismene。","cause":"Antigone is accused, and Ismene fears losing her sister.","action":"Ismene offers to share responsibility; Antigone refuses.","effect":"Antigone's engagement to Haemon becomes part of the conflict.","recall":"Why does Antigone reject Ismene’s attempt to share the punishment?","quote":"You chose to live, I chose to die.","triggers":["Ismene claims guilt later ≠ helped earlier","Haemon = Creon’s son + Antigone’s fiancé","Ismene is spared"],"details":["Antigone says she has no love for a friend who loves only in words.","Creon insults Antigone and declares the marriage over.","The chorus reflects on repeated suffering in Oedipus' family."]},{"title":"Haemon argues with Creon; the living tomb is chosen","short":"Father vs son","phase":"TURNING POINT","minutes":10,"priority":"EXAM CORE","summary":"Haemon first speaks respectfully to his father, but gradually challenges Creon's inflexibility. He reports that ordinary Thebans privately praise Antigone and believe she deserves honor, not death. He argues that wise people must listen, change, and bend rather than break, using trees in a flood and sails on a ship as images. Creon insists that a ruler must be obeyed and that he will never let a woman defeat him. Their disagreement becomes a bitter father-son quarrel. Haemon warns that Antigone's death will kill another person. Creon later announces he will spare Ismene but seal Antigone alive in a rocky vault with a small amount of food.","zh":"Haemon 勸父親傾聽民意與改變，借「樹會彎才能不折」比喻；Creon 固執重視王權與男性尊嚴。決定把 Antigone 活封在岩洞，Ismene 則獲釋。","cause":"Creon wants to kill Haemon's fiancée.","action":"Haemon appeals to public opinion and flexible judgment.","effect":"Creon insists on punishment; Haemon leaves furious.","recall":"What does Haemon mean by the bending trees, and how is Antigone sentenced?","quote":"It's no city at all, owned by one man alone.","triggers":["trees + sails = Haemon","citizens secretly support Antigone","anarchy = Creon’s fear","rocky vault = final punishment"],"details":["Haemon does not immediately rebel; he begins respectfully.","Creon says he would rather lose power to a man than a woman.","Haemon warns: her death will kill another.","The chorus sings about love (Aphrodite) causing conflict."]},{"title":"Antigone’s farewell, grief, and mythic parallels","short":"The tomb as a bridal chamber","phase":"TRAGIC DESCENT","minutes":8,"priority":"HIGH","summary":"As the guards take her toward the vault, Antigone mourns the wedding, married life, and children she will never have. She describes her tomb as a bridal chamber and the world of death as her wedding destination. She compares her fate with Niobe, who was turned into stone. The chorus reminds her she is a mortal and partly attributes the disaster to her passionate defiance and family curse. Antigone recalls the terrible history of Oedipus and Jocasta. In a striking passage, she claims she would not have taken the same risk for a husband or child because another husband or child might be possible, but with both parents dead she can never have another brother. She still believes she honored Polynices rightly.","zh":"Antigone 哀悼自己無法結婚生子，把「墳墓」比成「新房」，提到 Niobe 化石的命運。她還說父母已死，不能再有新的兄弟（容易出細節題）。","cause":"Creon orders Antigone sealed away alive.","action":"She laments her lost future and defends her choice.","effect":"Antigone is taken to the rocky prison; the chorus recalls figures trapped by fate.","recall":"Why is the tomb described as a bridal chamber?","quote":"O tomb, my bridal-bed—my house, my prison","triggers":["bridal-bed = tomb, not wedding","Niobe = turned to stone","no husband / no children","brother cannot be replaced"],"details":["Antigone mentions Acheron, Persephone, and the dead.","The chorus also invokes Danaë and Lycurgus in examples of destiny.","Creon gives a small ration to avoid direct ritual pollution of the city."]},{"title":"Tiresias warns that the gods reject the city","short":"Bad omens, terrible prophecy","phase":"TURNING POINT","minutes":10,"priority":"EXAM CORE","summary":"Tiresias, a blind prophet guided by a boy, tells Creon of horrifying omens: birds attack each other, sacrificial fire will not burn, and offerings are rejected. The unburied body has polluted Thebes because birds and dogs carry pieces of Polynices to altars. Tiresias says Creon has confused life and death: he has locked a living girl in a tomb while keeping a dead body above ground without burial. He warns that Creon will soon lose one of his own children. Creon first accuses the prophet of greed, but the chorus leader says Tiresias has never lied to Thebes. Creon begins to fear the prophecy.","zh":"盲眼先知 Tiresias 從鳥兆與祭祀失靈判斷：屍體汙染祭壇。活人 Antigone 被放到墳墓、死人 Polynices 卻留在人間；先知預告 Creon 將失去親骨肉。","cause":"Unburied Polynices contaminates altars and sacrifices.","action":"Tiresias warns Creon to bury the dead and respect divine order.","effect":"Creon fears he has offended the gods.","recall":"What are the two reversals of life and death in Tiresias’s accusation?","quote":"ruthlessly lodged a living soul within the grave","triggers":["blind prophet = Tiresias","bird omens + failed sacrifice","living buried / dead exposed","one born of your own loins = Creon’s child"],"details":["The boy guides Tiresias because he is blind.","Creon accuses Tiresias of being bribed, without proof.","The Furies are described as avengers who will punish the offense."]},{"title":"Creon repents, but he acts too late","short":"A reversal of judgment","phase":"TURNING POINT","minutes":4,"priority":"EXAM CORE","summary":"After Tiresias leaves, the chorus leader urges Creon to free Antigone from the rocky vault and raise a mound for Polynices. Creon finally decides to yield and do the work himself. The chorus then calls on Dionysus for help. This is an important timing detail: Creon DOES change his mind, but his correction arrives too late. His party goes first to recover and bury Polynices, then proceeds to the vault where Antigone was imprisoned.","zh":"Creon 終於接受長老建議，親自處理；但他先葬 Polynices，再去救 Antigone，結果為時已晚。","cause":"Tiresias' prophecy and the chorus leader's advice shake Creon.","action":"Creon decides to bury Polynices and release Antigone.","effect":"He reverses course, but cannot prevent the tragedies.","recall":"What is the actual order of Creon’s attempted repairs?","quote":"I shackled her,","triggers":["Creon changes his mind","buries Polynices FIRST","goes to Antigone SECOND","too late = tragedy"],"details":["The chorus leader says Tiresias has never lied to Thebes.","Creon rushes out with attendants.","The chorus invokes Dionysus, a god strongly connected with Thebes."]},{"title":"A messenger reports Antigone’s and Haemon’s deaths","short":"The failed rescue","phase":"CATASTROPHE","minutes":9,"priority":"EXAM CORE","summary":"A messenger announces that Haemon is dead, killed by his own hand. When Eurydice comes out, the messenger explains what happened. Creon's party first washed and buried Polynices. Then they came to the rocky vault and heard Haemon's voice. Inside, Antigone had hanged herself with her veil. Haemon was clinging to her body. When Creon pleaded with his son, Haemon spat at him, drew his sword, and lunged at him but missed. Haemon then turned the sword on himself and died embracing Antigone. Eurydice hears this terrible news and goes silently back into the palace.","zh":"使者說明：先安葬 Polynices，後到岩洞發現 Antigone 上吊身亡。Haemon 攻擊父親失手，之後用劍自盡並抱著 Antigone。Eurydice 聽後默默回宮。","cause":"Creon arrives at the vault after the deaths are already unfolding.","action":"Haemon tries to attack his father, misses, and kills himself.","effect":"Eurydice learns of her son's death and retreats into the palace.","recall":"Who died by hanging, who died by a sword, and did Haemon kill Creon?","quote":"there in the deepest,","triggers":["Antigone = hanging with veil","Haemon = own sword","attacks Creon but MISSES","Eurydice = silent exit"],"details":["The messenger is an eyewitness to the attempted rescue.","The bodies are found within the rocky tomb.","Haemon dies embracing Antigone.","Creon does not die during this incident."]},{"title":"Eurydice dies; Creon survives in despair","short":"The final moral","phase":"CATASTROPHE","minutes":7,"priority":"EXAM CORE","summary":"The chorus leader is disturbed by Eurydice's silence. Creon returns carrying Haemon's body and admits that his own stubbornness caused the tragedy. Another messenger then reveals that Eurydice has stabbed herself at an altar. Before dying, she mourned Megareus and Haemon and cursed Creon for the deaths of her sons. Creon accepts responsibility, begs to be taken away, and wishes for death. But he does not die in the play. The chorus closes with the lesson that wisdom and reverence for the gods are essential; proud words bring painful punishment and late understanding.","zh":"Eurydice 在祭壇自刺而死，臨終責怪 Creon 害死兒子。Creon 最後仍活著、深深懊悔。歌隊結語：智慧與敬神最重要，驕傲終將受罰。","cause":"Eurydice hears the death of her son Haemon.","action":"She kills herself and curses Creon; Creon accepts the blame.","effect":"Creon is left alive but devastated, completing the tragedy.","recall":"Who survives at the end, and what lesson does the chorus give?","quote":"Wisdom is by far the greatest part of joy","triggers":["Eurydice = stabbed herself at altar","Megareus = named in her lament","Creon survives","wisdom + reverence vs pride"],"details":["The body of Haemon is brought back to the palace.","Eurydice mentions Megareus, another deceased son.","Creon confesses responsibility; he is not literally Haemon's killer.","The last speaker is the chorus."]}],"vocab":[{"id":0,"term":"decree","zh":"法令、命令","en":"an official order made by someone in power","cue":"Creon’s ban on burying Polynices","group":"Law \u0026 power","priority":3,"context":"…iefs and mine. And now this: an emergency decree, they say, the Commander has just now declared for all of Thebes.…"},{"id":1,"term":"proclamation","zh":"公告、宣告","en":"a public announcement of an official decision","cue":"the public burial ban","group":"Law \u0026 power","priority":3,"context":"…ces, who died miserably— why, a city-wide proclamation, rumor has it, forbids anyone to bury him, even mourn him. He's…"},{"id":2,"term":"edict","zh":"政令、敕令","en":"an official order that must be obeyed","cue":"human edict vs gods’ laws","group":"Law \u0026 power","priority":3,"context":"…n such laws for men. Nor did I think your edict had such force that you, a mere mortal, could override the gods,…"},{"id":3,"term":"forbid","zh":"禁止","en":"to say that an action is not allowed","cue":"Creon forbids burial and mourning","group":"Law \u0026 power","priority":3,"context":"…, a city-wide proclamation, rumor has it, forbids anyone to bury him, even mourn him. He's to be left unwept, unbu…"},{"id":4,"term":"defy","zh":"公然違抗","en":"to refuse to obey an authority or rule","cue":"Antigone defies Creon","group":"Law \u0026 power","priority":3,"context":"…ISMENE: I'd do them no dishonor— but defy the city? I have no strength for that. ANTIGONE: You have yo…"},{"id":5,"term":"violate","zh":"違反","en":"to break a law or rule","cue":"breaking the laws of the city","group":"Law \u0026 power","priority":3,"context":"…a death we'll die, the worst of all if we violate the laws and override the fixed decree of the throne, its power—…"},{"id":6,"term":"override","zh":"凌駕、推翻","en":"to take priority over or set aside a rule","cue":"a mortal cannot override divine law","group":"Law \u0026 power","priority":3,"context":"…e worst of all if we violate the laws and override the fixed decree of the throne, its power— we must be sensible.…"},{"id":7,"term":"obey","zh":"服從","en":"to do what one is ordered to do","cue":"Ismene and Creon demand obedience","group":"Law \u0026 power","priority":3,"context":"…on't treat the matter lightly. Whoever disobeys in the least will die, his doom is sealed: stoning to death insi…"},{"id":8,"term":"authority","zh":"權威、權力","en":"the power to give orders or make decisions","cue":"king’s authority questioned by Haemon","group":"Law \u0026 power","priority":3,"context":"…from me. But that man the city places in authority, his orders must be obeyed, large and small, right and wrong.…"},{"id":9,"term":"throne","zh":"王位","en":"the royal position or seat of power","cue":"Creon inherits the throne","group":"Law \u0026 power","priority":2,"context":"…laws and override the fixed decree of the throne, its power— we must be sensible. Remember we are women, we're n…"},{"id":10,"term":"tyrant","zh":"暴君","en":"a ruler who exercises power harshly","cue":"Antigone challenges ruthless rule","group":"Law \u0026 power","priority":3,"context":"…ocked in fear. Pointing to CREON. Lucky tyrants—the perquisites of power! Ruthless power to do and say whatever…"},{"id":11,"term":"traitor","zh":"叛國者","en":"a person seen as betraying their country","cue":"Creon labels Polynices a traitor","group":"Law \u0026 power","priority":3,"context":"…er too. No one will ever convict me for a traitor. ISMENE: So desperate, and Creon has expressly— ANTIGONE:…"},{"id":12,"term":"patriot","zh":"愛國者","en":"someone devoted to their country","cue":"Creon calls Eteocles a patriot","group":"Law \u0026 power","priority":3,"context":"…nds will the traitor be honored above the patriot. But whoever proves his loyalty to the state— I'll prize that m…"},{"id":13,"term":"anarchy","zh":"無政府、無秩序","en":"the absence or breakdown of established rule","cue":"Creon fears disorder","group":"Law \u0026 power","priority":2,"context":"…eyed, large and small, right and wrong. Anarchy— show me a greater crime in all the earth! She, she destroys ci…"},{"id":14,"term":"insolence","zh":"傲慢無禮","en":"rude disrespect toward authority","cue":"Creon accuses Antigone","group":"Law \u0026 power","priority":3,"context":"…standing by. This girl was an old hand at insolence when she overrode the edicts we made public. But once she had d…"},{"id":15,"term":"rebellion","zh":"反叛","en":"resistance against an authority or ruler","cue":"Antigone’s burial seen as rebellion","group":"Law \u0026 power","priority":2,"context":"…e dead. Imagine it: I caught her in naked rebellion, the traitor, the only one in the whole city. I'm not about to…"},{"id":16,"term":"subordinate","zh":"從屬的、下屬","en":"having less power or lower rank","cue":"Creon expects Haemon’s submission","group":"Law \u0026 power","priority":2,"context":"…how you ought to feel within your heart, subordinate to your father's will in every way. That's what a man prays for:…"},{"id":17,"term":"verdict","zh":"裁決、判決","en":"a decision about guilt or punishment","cue":"Creon’s final decision on Antigone","group":"Law \u0026 power","priority":3,"context":"…ng to HAEMON. Son, you've heard the final verdict on your bride? Are you coming now, raving against your father?…"},{"id":18,"term":"convict","zh":"宣判有罪","en":"to decide someone is guilty of wrongdoing","cue":"Antigone refuses the label of traitor","group":"Law \u0026 power","priority":2,"context":"…ill— your brother too. No one will ever convict me for a traitor. ISMENE: So desperate, and Creon has expres…"},{"id":19,"term":"sentence","zh":"判刑","en":"a punishment officially declared","cue":"Antigone’s death sentence","group":"Law \u0026 power","priority":3,"context":"…eep from knowing?—even without your death-sentence ringing in my ears. And if I am to die orts the burial first, then the journey to the cave.","cue":"rescue sequence → burial FIRST","evidence":"we turned and made"},{"id":49,"cat":"plot","scene":9,"question":"How is Antigone found inside the cave?","answer":"Hanged by her veil","wrong":["Stabbed by a sword","Killed by falling rocks","Poisoned by the guards"],"why":"The messenger describes her hanging in a linen noose.","cue":"Antigone cause of death → hanging","evidence":"strangled in her veils"},{"id":50,"cat":"plot","scene":9,"question":"What does Haemon do when Creon tries to approach him?","answer":"He attempts to stab Creon but misses.","wrong":["He immediately embraces his father.","He quietly leaves with the guards.","He kills the messenger."],"why":"Haemon lunges with the sword but Creon escapes.","cue":"Haemon attacks father → misses","evidence":"Haemon lunged and missed"},{"id":51,"cat":"plot","scene":9,"question":"How does Haemon die?","answer":"He kills himself with his own sword.","wrong":["Creon stabs him in the chest.","Antigone poisons him.","The guards stone him."],"why":"The messenger and chorus explicitly state Haemon’s own hand killed him.","cue":"Haemon ≠ murdered by Creon physically","evidence":"His own"},{"id":52,"cat":"plot","scene":9,"question":"What does Eurydice do after hearing about Haemon’s death?","answer":"She quietly returns inside the palace.","wrong":["She follows Creon to the cave.","She denounces Antigone in public.","She orders the guards to kill Tiresias."],"why":"Her silent exit worries the chorus.","cue":"Eurydice silence = danger","evidence":"without a word"},{"id":53,"cat":"plot","scene":10,"question":"How does Eurydice die?","answer":"She stabs herself at an altar.","wrong":["She is buried alive.","Creon executes her.","She dies in battle against Argos."],"why":"The messenger reports a self-inflicted fatal wound.","cue":"Eurydice → own sword / altar","evidence":"She stabbed herself at the altar"},{"id":54,"cat":"plot","scene":10,"question":"What does Eurydice d "wrong":["He forgives him and bows.","He asks permission to leave Thebes.","He gives his sword to the sentry."],"why":"The messenger describes the failed attack.","cue":"Haemon vs Creon → missed attack","evidence":"spat in his face"},{"id":132,"cat":"details","scene":9,"question":"What causes Eurydice to leave the scene silently?","answer":"The news of Haemon’s death","wrong":["The arrival of the Argive army","Creon’s promise to make her queen","Ismene’s public confession"],"why":"She has just heard the eyewitness report about Haemon.","cue":"silent Eurydice = grief","evidence":"without a word"},{"id":133,"cat":"details","scene":10,"question":"Where does Eurydice kill herself?","answer":"At an altar in the palace","wrong":["At Antigone’s rocky vault","On the battlefield of Argos","At the seven gates"],"why":"The messenger says she stabbed herself at the altar.","cue":"Eurydice → altar","evidence":"stabbed herself at the altar"},{"id":134,"cat":"details","scene":10,"question":"What does Creon ask attendants to do at the end?","answer":"Take him away, out of sight","wrong":["Bring Antigone back alive","Send Haemon to Argos","Punish Tiresias"],"why":"He wants to be removed while overwhelmed by guilt.","cue":"Take me away → Creon","evidence":"Take me away"},{"id":135,"cat":"details","scene":10,"question":"What does the chorus explicitly say is the greatest part of joy?","answer":"Wisdom","wrong":["Military glory","Political power","Romantic love"],"why":"The closing statement puts wisdom first.","cue":"final line → Wisdom","evidence":"Wisdom is by far"},{"id":136,"cat":"vocab","scene":0,"question":"In “an emergency decree,” what does “decree” mean?","answer":"An official order","wrong":["A family celebration","A religious building","A secret marriage"],"why":"Creon’s decree is an official command.","cue":"decree = official law","evidence":"an emergency decree"},{"id":137,"cat":"vocab","scene":0,"question":"What does “defy” mean in the context of Antigone’s choice?","answer":"Refuse to obey","wrong":["Beg for mercy","Prove someone innocent","Leave the city secretly"],"why":"Ismene fears defying city authority.","cue":"defy = disobey","evidence":"defy the city"},{"id":138,"cat":"vocab","scene":0,"question":"What is the closest meaning of “flesh and blood”?","answer":"Close family members","wrong":["Food for the dead","A military victory","A public proclamation"],"why":"Antigone speaks of her family ties.","cue":"flesh and blood = family","evidence":"My own flesh and blood"},{"id":139,"cat":"vocab","scene":1,"question":"In Creon’s speech, what is a “traitor”?","answer":"Someone seen as betraying their country","wrong":["A person devoted to a country","A religious messenger","A soldier carrying no weapon"],"why":"Creon calls Polynices a traitor.","cue":"traitor ≠ patriot","evidence":"the traitor"},{"id":140,"cat":"vocab","scene":1,"question":"What is a “patriot”?","answer":"A person loyal to their country","wrong":["An enemy soldier","A blind prophet","A dead king"],"why":"Creon contrasts patriot and traitor.","cue":"patriot = loyal defender","evidence":"the patriot"},{"id":141,"cat":"vocab","scene":2,"question":"What does “bribed” mean?","answer":"Dishonestly paid or persuaded with money","wrong":["Publicly forgiven","Sent away in exile","Blessed by a prophet"],"why":"Creon accuses the guards of accepting money.","cue":"bribed = money for dishonesty","evidence":"bribed them"},{"id":142,"cat":"vocab","scene":2,"question":"What does “carrion” refer to?","answer":"Dead flesh eaten by animals","wrong":["A royal chariot","A marriage song","A sacred wreath"],"why":"The unburied corpse attracts birds and dogs.","cue":"carrion = dead flesh","evidence":"carrion for the birds"},{"id":143,"cat":"vocab","scene":3,"question":"What are “libations” in the sentry’s report?","answer":"Liquids poured as ritual offerings","wrong":["Military orders written on stone","Chains used to imprison someone","Spears awarded to victors"],"why":"Antigone pours three ritual offerings.","cue":"libations = poured liquid","evidence":"three full libations"},{"id":144,"cat":"vocab","scene":3,"question":"What does “unwritten” mean in “unwritten laws”?","answer":"Not recorded in written statutes","wrong":["Officially posted on every wall","Known only to the king","Written in a foreign language"],"why":"Antigone appeals to traditions older than any decree.","cue":"unwritten = not in a written code","evidence":"the great unwritten"},{"id":145,"cat":"vocab","scene":3,"question":"What does “override” mean in Antigone’s argument?","answer":"Take priority over or set aside","wrong":["Repeat someone’s words","Hide a burial site","Bring back the dead"],"why":"She denies that a king can override divine laws.","cue":"override = take priority over","evidence":"override the gods"},{"id":146,"cat":"vocab","scene":4,"question":"A “bride” is someone who is about to become a…","answer":"Wife","wrong":["Sister","Mother","Queen’s guard"],"why":"Antigone is Haemon’s promised bride.","cue":"bride = woman to marry","evidence":"your own son's bride"},{"id":147,"cat":"vocab","scene":5,"question":"What does “rigid” mean in Haemon’s argument?","answer":"Unwilling to change or bend","wrong":["Unusually generous","Unable to hear sounds","Difficult to recognize"],"why":"Haemon asks Creon not to be stubborn.","cue":"rigid = inflexible","evidence":"too rigid"},{"id":148,"cat":"vocab","scene":5,"question":"What does “anarchy” mean in Creon’s speech?","answer":"Breakdown of established rule and order","wrong":["A wedding celebration","A sacred offering","A formal apology"],"why":"Creon fears that disobedience destroys order.","cue":"anarchy = disorder","evidence":"Anarchy"},{"id":149,"cat":"vocab","scene":5,"question":"What does “vault” mean in the punishment of Antigone?","answer":"A stone burial chamber","wrong":["A military training field","A public marketplace","A room for a wedding feast"],"why":"Creon seals Antigone alive in a rocky vault.","cue":"vault = chamber / tomb","evidence":"rocky vault"},{"id":150,"cat":"vocab","scene":6,"question":"What does “dirge” mean?","answer":"A mournful song for the dead","wrong":["A song of military triumph","A public law","A whispered prophecy"],"why":"The chorus contrasts funeral songs with Antigone’s fate.","cue":"dirge = funeral lament","evidence":"with a dirge"},{"id":151,"cat":"vocab","scene":6,"question":"What does “agony” mean?","answer":"Intense suffering","wrong":["Quiet satisfaction","Political authority","A musical performance"],"why":"Antigone repeatedly describes her pain.","cue":"agony = severe pain","evidence":"I am agony"},{"id":152,"cat":"vocab","scene":7,"question":"What is an “omen”?","answer":"A sign believed to predict what will happen","wrong":["A ceremonial drink","A wedding vow","A royal punishment"],"why":"Tiresias interprets signs from birds and sacrifices.","cue":"omen = prophetic sign","evidence":"an omen clear and true"},{"id":153,"cat":"vocab","scene":7,"question":"What is a “seer”?","answer":"A person who predicts or reveals hidden truths","wrong":["A person who guards a corpse","A person who refuses marriage","A ruler elected by citizens"],"why":"Tiresias is called a seer.","cue":"seer = prophet","evidence":"reverend old Tiresias"},{"id":154,"cat":"vocab","scene":7,"question":"What does “defilement” mean in this religious context?","answer":"Pollution of what is sacred","wrong":["Proof of military victory","A formal invitation","A secret engagement"],"why":"Tiresias says the corpse pollutes the altars.","cue":"defilement = religious pollution","evidence":"such defilement"},{"id":155,"cat":"vocab","scene":7,"question":"What does “retribution” mean?","answer":"Punishment for a wrongdoing","wrong":["An unexpected wedding","A gift from a friend","The act of taking a throne"],"why":"Antigone fears divine punishment for wrong actions.","cue":"retribution = deserved punishment","evidence":"retribution of the gods"},{"id":156,"cat":"vocab","scene":7,"question":"What does “yield” mean in Tiresias’s advice?","answer":"Give way or stop resisting","wrong":["Attack harder","Bury someone secretly","Pretend to be a prophet"],"why":"Creon must accept correction rather than persist.","cue":"yield = give way","evidence":"yield to the dead"},{"id":157,"cat":"vocab","scene":10,"question":"What does “reverence” mean in the final message?","answer":"Deep respect, especially toward gods","wrong":["Revenge against a family","The fear of soldiers","An official law"],"why":"The final chorus values reverence for divine authority.","cue":"reverence = profound respect","evidence":"reverence toward the gods"},{"id":158,"cat":"vocab","scene":10,"question":"What does “wisdom” mean in the ending?","answer":"The ability to judge and act well","wrong":["The right to punish all opponents","Success at fighting a war","The refusal to change any opinion"],"why":"The chorus praises wise judgment.","cue":"wisdom = good judgment","evidence":"Wisdom is by far"},{"id":159,"cat":"vocab","scene":10,"question":"What does “stubbornness” mean?","answer":"Refusal to change one’s mind","wrong":["Willingness to listen","The power to predict the future","A sacred funeral ritual"],"why":"Tiresias warns and Creon learns too late.","cue":"stubbornness = inflexibility","evidence":"Stubbornness"},{"id":160,"cat":"vocab","scene":9,"question":"In the report of Antigone’s death, a “noose” is…","answer":"A loop used for hanging","wrong":["A sword blade","A royal decree","A small portion of food"],"why":"Antigone is found hanged in a noose.","cue":"noose = hanging","evidence":"fine linen noose"}],"source":"# ANTIGONE\n\n## CHARACTERS\n\n* **ANTIGONE** — daughter of Oedipus and Jocasta\n* **ISMENE** — sister of Antigone\n* **A CHORUS** — of old Theban citizens and their **LEADER**\n* **CREON** — king of Thebes, uncle of Antigone and Ismene\n* **A SENTRY**\n* **HAEMON** — son of Creon and Eurydice\n* **TIRESIAS** — a blind prophet\n* **A MESSENGER**\n* **EURYDICE** — wife of Creon\n* *Guards, attendants, and a boy*\n\n---\n\n\u003e *[Line numbers at the head of each page refer to the Greek text; those in the margin refer to the English translation.]*\n\n**TIME AND SCENE:** The royal house of Thebes. It is still night, and the invading armies of Argos have just been driven from the city. Fighting on opposite sides, the sons of Oedipus, Eteocles and Polynices, have killed each other in combat. Their uncle, CREON, is now king of Thebes.\n\n*Enter ANTIGONE, slipping through the central doors of the palace. She motions to her sister, ISMENE, who follows her cautiously toward an altar at the center of the stage.*\n\n**ANTIGONE:**  \nMy own flesh and blood—dear sister, dear Ismene,  \nhow many griefs our father Oedipus handed down!  \nDo you know one, I ask you, one grief  \nthat Zeus will not perfect for the two of us  \nwhile we still live and breathe? There's nothing,  \nno pain—our lives are pain—no private shame,  \nno public disgrace, nothing I haven't seen  \nin your griefs and mine. And now this:  \nan emergency decree, they say, the Commander  \nhas just now declared for all of Thebes.  \nWhat, haven't you heard? Don't you see?  \nThe doom reserved for enemies  \nmarches on the ones we love the most.\n\n**ISMENE:**  \nNot I, I haven't heard a word, Antigone.  \nNothing of loved ones,  \nno joy or pain has come my way, not since  \nthe two of us were robbed of our two brothers,  \nboth gone in a day, a double blow—  \nnot since the armies of Argos vanished,  \njust this very night. I know nothing more,  \nwhether our luck's improved or ruin's still to come.\n\n**ANTIGONE:**  \nI thought so. That's why I brought you out here,  \npast the gates, so you could hear in private.\n\n**ISMENE:**  \nWhat's the matter? Trouble, clearly—  \nyou sound so dark, so grim.\n\n**ANTIGONE:**  \nWhy not? Our own brothers' burial!  \nHasn't Creon graced one with all the rites,  \ndisgraced the other? Eteocles, they say,  \nhas been given full military honors,  \nrightly so—Creon has laid him in the earth  \nand he goes with glory down among the dead.  \nBut the body of Polynices, who died miserably—  \nwhy, a city-wide proclamation, rumor has it,  \nforbids anyone to bury him, even mourn him.  \nHe's to be left unwept, unburied, a lovely treasure  \nfor birds that scan the field and feast to their heart's content.  \nSuch, I hear, is the martial law our good Creon  \nlays down for you and me—yes, me, I tell you—  \nand he's coming here to alert the uninformed  \nin no uncertain terms,  \nand he won't treat the matter lightly. Whoever  \ndisobeys in the least will die, his doom is sealed:  \nstoning to death inside the city walls!  \nThere you have it. You'll soon show what you are,  \nworth your breeding, Ismene, or a coward—  \nfor all your royal blood.\n\n**ISMENE:**  \nMy poor sister, if things have come to this,  \nwho am I to make or mend them, tell me,  \nwhat good am I to you?\n\n**ANTIGONE:**  \nDecide.  \nWill you share the labor, share the work?\n\n**ISMENE:**  \nWhat work, what's the risk? What do you mean?\n\n**ANTIGONE:**  \n*Raising her hands.*  \nWill you lift up his body with these bare hands  \nand lower it with me?\n\n**ISMENE:**  \nWhat? You'd bury him  \nwhen a law forbids the city?\n\n**ANTIGONE:**  \nYes!  \nHe is my brother—and deny it as you will—  \nyour brother too.  \nNo one will ever convict me for a traitor.\n\n**ISMENE:**  \nSo desperate, and Creon has expressly—\n\n**ANTIGONE:**  \nNo,  \nhe has no right to keep me from my own.\n\n**ISMENE:**  \nOh my sister, think—  \nthink how our own father died, hated,  \nhis reputation in ruins, driven on  \nby the crimes he brought to light himself  \nto gouge out his eyes with his own hands—  \nthen mother ... his mother and wife, both in one,  \nmutilating her life in the twisted noose—  \nand last, our two brothers dead in a single day,  \nboth shedding their own blood, poor suffering boys,  \nbattling out their common destiny hand-to-hand.  \nNow look at the two of us, left so alone—  \nthink what a death we'll die, the worst of all  \nif we violate the laws and override  \nthe fixed decree of the throne, its power—  \nwe must be sensible. Remember we are women,  \nwe're not born to contend with men. Then too,  \nwe're underlings, ruled by much stronger hands,  \nso we must submit in this, and things still worse.  \nI, for one, I'll beg the dead to forgive me—  \nI'm forced, I have no choice—I must obey  \nthe ones who stand in power. Why rush to extremes?  \nIt's madness, madness.\n\n---\n\n**ANTIGONE:**  \nI won't insist,  \nno, even if you should have a change of heart,  \nI'd never welcome you in the labor, not with me.  \nSo, do as you like, whatever suits you best—  \nI will bury him myself.  \nAnd even if I die in the act, that death will be a glory.  \nI will lie with the one I love and loved by him—  \nan outrage sacred to the gods! I have longer  \nto please the dead than please the living here:  \nin the kingdom down below I'll lie forever.  \nDo as you like, dishonor the laws  \nthe gods hold in honor.\n\n**ISMENE:**  \nI'd do them no dishonor—  \nbut defy the city? I have no strength for that.\n\n**ANTIGONE:**  \nYou have your excuses. I am on my way,  \nI will raise a mound for him, for my dear brother.\n\n**ISMENE:**  \nOh Antigone, you're so rash—I'm so afraid for you!\n\n**ANTIGONE:**  \nDon't fear for me. Set your own life in order.\n\n**ISMENE:**  \nThen don't, at least, blurt this out to anyone.  \nKeep it a secret. I'll join you in that, I promise.\n\n**ANTIGONE:**  \nDear god, shout it from the rooftops. I'll hate you  \nall the more for silence—tell the world!\n\n**ISMENE:**  \nSo fiery—and it ought to chill your heart.\n\n**ANTIGONE:**  \nI know I please where I must please the most.\n\n**ISMENE:**  \nYes, if you can, but you're in love with impossibility.\n\n**ANTIGONE:**  \nVery well then, once my strength gives out  \nI will be done at last.\n\n**ISMENE:**  \nYou're wrong from the start,  \nyou're off on a hopeless quest.\n\n**ANTIGONE:**  \nIf you say so, you will make me hate you,  \nand the hatred of the dead, by all rights,  \nwill haunt you night and day.  \nBut leave me to my own absurdity, leave me  \nto suffer this dreadful thing. I will suffer  \nnothing as great as death without glory.\n\n*Exit to the side.*\n\n**ISMENE:**  \nThen go if you must, but rest assured,  \nwild, irrational as you are, my sister,  \nyou are truly dear to the ones who love you.\n\n*Withdrawing to the palace.*\n\n*Enter a CHORUS, the old citizens of Thebes, chanting as the sun begins to rise.*\n\n**CHORUS:**  \nGlory! great beam of the sun, brightest of all  \nthat ever rose on the seven gates of Thebes,  \nyou burn through night at last!  \nGreat eye of the golden day,  \nmounting the Dirce's banks you throw him back—  \nthe enemy out of Argos, the white shield, the man of bronze—  \nhe's flying headlong now  \nthe bridle of fate stampeding him with pain!  \nAnd he had driven against our borders,  \nlaunched by the warring claims of Polynices—  \nlike an eagle screaming, winging havoc  \nover the land, wings of armor  \nshielded white as snow,  \na huge army massing,  \ncrested helmets bristling for assault.  \nHe hovered above our roofs, his vast maw gaping  \nclosing down around our seven gates,  \nhis spears thirsting for the kill—  \nbut now he's gone, look,  \nbefore he could glut his jaws with Theban blood  \nor the god of fire put our crown of towers to the torch.  \nHe grappled the Dragon none can master—Thebes—  \nthe clang of our arms like thunder at his back!  \nZeus hates with a vengeance all bravado,  \nthe mighty boasts of men. He watched them  \ncoming on in a rising flood, the pride  \nof their golden armor ringing shrill—  \nand brandishing his lightning  \nblasted the fighter just at the goal,  \nrushing to shout his triumph from our walls.  \nDown from the heights he crashed, pounding down on the earth!  \nAnd a moment ago, blazing torch in hand—  \nmad for attack, ecstatic  \nhe breathed his rage, the storm  \nof his fury hurling at our heads!  \nBut now his high hopes have laid him low  \nand down the enemy ranks the iron god of war  \ndeals his rewards, his stunning blows—Ares  \nrapture of battle, our right arm in the crisis.  \nSeven captains marshaled at seven gates  \nseven against their equals, gave  \ntheir brazen trophies up to Zeus,  \ngod of the breaking rout of battle,  \nall but two: those blood brothers,  \none father, one mother—matched in rage,  \nspears matched for the twin conquest—  \nclashed and won the common prize of death.  \nBut now for Victory! Glorious in the morning,  \njoy in her eyes to meet our joy  \nshe is winging down to Thebes,  \nour fleets of chariots wheeling in her wake—  \nNow let us win oblivion from the wars,  \nthronging the temples of the gods  \nin singing, dancing choirs through the night!  \nLord Dionysus, god of the dance  \nthat shakes the land of Thebes, now lead the way!\n\n*Enter CREON from the palace, attended by his guard.*\n\nBut look, the king of the realm is coming,  \nCreon, the new man for the new day,  \nwhatever the gods are sending now—  \nwhat new plan will he launch?  \nWhy this, this special session?  \nWhy this sudden call to the old men  \nsummoned at one command?\n\n**CREON:**  \nMy countrymen,  \nthe ship of state is safe. The gods who rocked her,  \nafter a long, merciless pounding in the storm,  \nhave righted her once more.  \nOut of the whole city  \nI have called you here alone. Well I know,  \nfirst, your undeviating respect  \nfor the throne and royal power of King Laius.  \nNext, while Oedipus steered the land of Thebes,  \nand even after he died, your loyalty was unshakable,  \nyou still stood by their children. Now then,  \nsince the two sons are dead—two blows of fate  \nin the same day, cut down by each other's hands,  \nboth killers, both brothers stained with blood—  \nas I am next in kin to the dead,  \nI now possess the throne and all its powers.  \nOf course you cannot know a man completely,  \nhis character, his principles, sense of judgment,  \nnot till he's shown his colors, ruling the people,  \nmaking laws. Experience, there's the test.  \nAs I see it, whoever assumes the task,  \nthe awesome task of setting the city's course,  \nand refuses to adopt the soundest policies  \nbut fearing someone, keeps his lips locked tight,  \nhe's utterly worthless. So I rate him now,  \nI always have. And whoever places a friend  \nabove the good of his own country, he is nothing:  \nI have no use for him. Zeus my witness,  \nZeus who sees all things, always—  \nI could never stand by silent, watching destruction  \nmarch against our city, putting safety to rout,  \nnor could I ever make that man a friend of mine  \nwho menaces our country. Remember this:  \nour country is our safety.  \nOnly while she voyages true on course  \ncan we establish friendships, truer than blood itself.  \nSuch are my standards. They make our city great.  \nClosely akin to them I have proclaimed,  \njust now, the following decree to our people  \nconcerning the two sons of Oedipus.  \nEteocles, who died fighting for Thebes,  \nexcelling all in arms: he shall be buried,  \ncrowned with a hero's honors, the cups we pour  \nto soak the earth and reach the famous dead.  \nBut as for his blood brother, Polynices,  \nwho returned from exile, home to his father-city  \nand the gods of his race, consumed with one desire—  \nto burn them roof to roots—who thirsted to drink  \nhis kinsmen's blood and sell the rest to slavery:  \nthat man—a proclamation has forbidden the city  \nto dignify him with burial, mourn him at all.  \nNo, he must be left unburied, his corpse  \ncarrion for the birds and dogs to tear,  \nan obscenity for the citizens to behold!  \nThese are my principles. Never at my hands  \nwill the traitor be honored above the patriot.  \nBut whoever proves his loyalty to the state—  \nI'll prize that man in death as well as life.\n\n**LEADER:**  \nIf this is your pleasure, Creon, treating  \nour city's enemy and our friend this way ...  \nThe power is yours, I suppose, to enforce it  \nwith the laws, both for the dead and all of us,  \nthe living.\n\n**CREON:**  \nFollow my orders closely then,  \nbe on your guard.\n\n**LEADER:**  \nWe are too old.  \nLay that burden on younger shoulders.\n\n**CREON:**  \nNo, no,  \nI don't mean the body—I've posted guards already.\n\n**LEADER:**  \nWhat commands for us then? What other service?\n\n**CREON:**  \nSee that you never side with those who break my orders.\n\n**LEADER:**  \nNever. Only a fool could be in love with death.\n\n**CREON:**  \nDeath is the price—you're right. But all too often  \nthe mere hope of money has ruined many men.\n\n*A SENTRY enters from the side.*\n\n**SENTRY:**  \nMy lord,  \nI can't say I'm winded from running, or set out  \nwith any spring in my legs either—no sir,  \nI was lost in thought, and it made me stop, often,  \ndead in my tracks, wheeling, turning back,  \nand all the time a voice inside me muttering,  \n\"Idiot, why? You're going straight to your death.\"  \nThen muttering, \"Stopped again, poor fool?  \nIf somebody gets the news to Creon first,  \nwhat's to save your neck?\"  \nAnd so,  \nmulling it over, on I trudged, dragging my feet,  \nyou can make a short road take forever ...  \nbut at last, look, common sense won out,  \nI'm here, and I'm all yours,  \nand even though I come empty-handed  \nI'll tell my story just the same, because  \nI've come with a good grip on one hope,  \nwhat will come will come, whatever fate—\n\n**CREON:**  \nCome to the point!  \nWhat's wrong—why so afraid?\n\n**SENTRY:**  \nFirst, myself, I've got to tell you,  \nI didn't do it, didn't see who did—  \nBe fair, don't take it out on me.\n\n**CREON:**  \nYou're playing it safe, soldier,  \nbarricading yourself from any trouble.  \nIt's obvious, you've something strange to tell.\n\n**SENTRY:**  \nDangerous too, and danger makes you delay  \nfor all you're worth.\n\n**CREON:**  \nOut with it—then dismiss!\n\n**SENTRY:**  \nAll right, here it comes. The body—  \nsomeone's just buried it, then run off ...  \nsprinkled some dry dust on the flesh,  \ngiven it proper rites.\n\n**CREON:**  \nWhat? What man alive would dare—\n\n**SENTRY:**  \nI've no idea, I swear it.  \nThere was no mark of a spade, no pickaxe there,  \nno earth turned up, the ground packed hard and dry,  \nunbroken, no tracks, no wheelruts, nothing,  \nthe workman left no trace. Just at sunup  \nthe first watch of the day points it out—  \nit was a wonder! We were stunned ...  \na terrific burden too, for all of us, listen:  \nyou can't see the corpse, not that it's buried,  \nreally, just a light cover of road-dust on it,  \nas if someone meant to lay the dead to rest  \nand keep from getting cursed.  \nNot a sign in sight that dogs or wild beasts  \nhad worried the body, even torn the skin.  \nBut what came next! Rough talk flew thick and fast,  \nguard grilling guard—we'd have come to blows  \nat last, nothing to stop it; each man for himself  \nand each the culprit, no one caught red-handed,  \nall of us pleading ignorance, dodging the charges,  \nready to take up red-hot iron in our fists,  \ngo through fire, swear oaths to the gods—  \n\"I didn't do it, I had no hand in it either,  \nnot in the plotting, not the work itself!\"  \nFinally, after all this wrangling came to nothing,  \none man spoke out and made us stare at the ground,  \nhanging our heads in fear. No way to counter him,  \nno way to take his advice and come through  \nsafe and sound. Here's what he said:  \n\"Look, we've got to report the facts to Creon,  \nwe can't keep this hidden.\" Well, that won out,  \nand the lot fell to me, condemned me,  \nunlucky as ever, I got the prize. So here I am,  \nagainst my will and yours too, well I know—  \nno one wants the man who brings bad news.\n\n**LEADER:**  \nMy king,  \never since he began I've been debating in my mind,  \ncould this possibly be the work of the gods?\n\n**CREON:**  \nStop—  \nbefore you make me choke with anger—the gods!  \nYou, you're senile, must you be insane?  \nYou say—why it's intolerable—say the gods  \ncould have the slightest concern for that corpse?  \nTell me, was it for meritorious service  \nthey proceeded to bury him, prized him so? The hero  \nwho came to burn their temples ringed with pillars,  \ntheir golden treasures—scorch their hallowed earth  \nand fling their laws to the winds.  \nExactly when did you last see the gods  \ncelebrating traitors? Inconceivable!  \nNo, from the first there were certain citizens  \nwho could hardly stand the spirit of my regime,  \ngrumbling against me in the dark, heads together,  \ntossing wildly, never keeping their necks beneath  \nthe yoke, loyally submitting to their king.  \nThese are the instigators, I'm convinced—  \nthey've perverted my own guard, bribed them  \nto do their work.  \nMoney! Nothing worse  \nin our lives, so current, rampant, so corrupting.  \nMoney—you demolish cities, root men from their homes,  \nyou train and twist good minds and set them on  \nto the most atrocious schemes. No limit,  \nyou make them adept at every kind of outrage,  \nevery godless crime—money!  \nEveryone—  \nthe whole crew bribed to commit this crime,  \nthey've made one thing sure at least:  \nsooner or later they will pay the price.\n\n*Wheeling on the SENTRY.*\n\nYou—  \nI swear to Zeus as I still believe in Zeus,  \nif you don't find the man who buried that corpse,  \nthe very man, and produce him before my eyes,  \nsimple death won't be enough for you,  \nnot till we string you up alive  \nand wring the immorality out of you.  \nThen you can steal the rest of your days,  \nbetter informed about where to make a killing.  \nYou'll have learned, at last, it doesn't pay  \nto itch for rewards from every hand that beckons.  \nFilthy profits wreck most men, you'll see—  \nthey'll never save your life.\n\n**SENTRY:**  \nPlease,  \nmay I say a word or two, or just turn and go?\n\n**CREON:**  \nCan't you tell? Everything you say offends me.\n\n**SENTRY:**  \nWhere does it hurt you, in the ears or in the heart?\n\n**CREON:**  \nAnd who are you to pinpoint my displeasure?\n\n**SENTRY:**  \nThe culprit grates on your feelings,  \nI just annoy your ears.\n\n**CREON:**  \nStill talking?  \nYou talk too much! A born nuisance—\n\n**SENTRY:**  \nMaybe so,  \nbut I never did this thing, so help me!\n\n**CREON:**  \nYes you did—  \nwhat's more, you squandered your life for silver!\n\n**SENTRY:**  \nOh it's terrible when the one who does the judging  \njudges things all wrong.\n\n**CREON:**  \nWell now,  \nyou just be clever about your judgments—  \nif you fail to produce the criminals for me,  \nyou'll swear your dirty money brought you pain.\n\n*Turning sharply, reentering the palace.*\n\n**SENTRY:**  \nI hope he's found. Best thing by far.  \nBut caught or not, that's in the lap of fortune:  \nI'll never come back, you've seen the last of me.  \nI'm saved, even now, and I never thought,  \nI never hoped—  \ndear gods, I owe you all my thanks!\n\n*Rushing out.*\n\n**CHORUS:**  \nNumberless wonders  \nterrible wonders walk the world but none the match for man—  \nthat great wonder crossing the heaving gray sea,  \ndriven on by the blasts of winter  \non through breakers crashing left and right,  \nholds his steady course  \nand the oldest of the gods he wears away—  \nthe Earth, the immortal, the inexhaustible—  \nas his plows go back and forth, year in, year out  \nwith the breed of stallions turning up the furrows.  \nAnd the blithe, lightheaded race of birds he snares,  \nthe tribes of savage beasts, the life that swarms the depths—  \nwith one fling of his nets  \nwoven and coiled tight, he takes them all,  \nman the skilled, the brilliant!  \nHe conquers all, taming with his techniques  \nthe prey that roams the cliffs and wild lairs,  \ntraining the stallion, clamping the yoke across  \nhis shaggy neck, and the tireless mountain bull.  \nAnd speech and thought, quick as the wind  \nand the mood and mind for law that rules the city—  \nall these he has taught himself  \nand shelter from the arrows of the frost  \nwhen there's rough lodging under the cold clear sky  \nand the shafts of lashing rain—  \nready, resourceful man!  \nNever without resources  \nnever an impasse as he marches on the future—  \nonly Death, from Death alone he will find no rescue  \nbut from desperate plagues he has plotted his escapes.  \nMan the master, ingenious past all measure  \npast all dreams, the skills within his grasp—  \nhe forges on, now to destruction  \nnow again to greatness. When he weaves in  \nthe laws of the land, and the justice of the gods\n\n---\n\nthat binds his oaths together  \nhe and his city rise high—  \nbut the city casts out  \nthat man who weds himself to inhumanity  \nthanks to reckless daring. Never share my hearth  \nnever think my thoughts, whoever does such things.\n\n*Enter ANTIGONE from the side, accompanied by the SENTRY.*\n\nHere is a dark sign from the gods—  \nwhat to make of this? I know her,  \nhow can I deny it? That young girl's Antigone!  \nWretched, child of a wretched father,  \nOedipus. Look, is it possible?  \nThey bring you in like a prisoner—  \nwhy? did you break the king's laws?  \nDid they take you in some act of mad defiance?\n\n**SENTRY:**  \nShe's the one, she did it single-handed—  \nwe caught her burying the body. Where's Creon?\n\n*Enter CREON from the palace.*\n\n**LEADER:**  \nBack again, just in time when you need him.\n\n**CREON:**  \nIn time for what? What is it?\n\n**SENTRY:**  \nMy king,  \nthere's nothing you can swear you'll never do—  \nsecond thoughts make liars of us all.  \nI could have sworn I wouldn't hurry back  \n(what with your threats, the buffeting I just took),  \nbut a stroke of luck beyond our wildest hopes,  \nwhat a joy, there's nothing like it. So,  \nback I've come, breaking my oath, who cares?  \nI'm bringing in our prisoner—this young girl—  \nwe took her giving the dead the last rites.  \nBut no casting lots this time; this is my luck,  \nmy prize, no one else's.  \nNow, my lord,  \nhere she is. Take her, question her,  \ncross-examine her to your heart's content.  \nBut set me free, it's only right—  \nI'm rid of this dreadful business once for all.\n\n**CREON:**  \nPrisoner! Her? You took her where, doing what?\n\n**SENTRY:**  \nBurying the man. That's the whole story.\n\n**CREON:**  \nWhat?  \nYou mean what you say, you're telling me the truth?\n\n**SENTRY:**  \nShe's the one. With my own eyes I saw her  \nbury the body, just what you've forbidden.  \nThere. Is that plain and clear?\n\n**CREON:**  \nWhat did you see? Did you catch her in the act?\n\n**SENTRY:**  \nHere's what happened. We went back to our post,  \nthose threats of yours breathing down our necks—  \nwe brushed the corpse clean of the dust that covered it,  \nstripped it bare ... it was slimy, going soft,  \nand we took to high ground, backs to the wind  \nso the stink of him couldn't hit us;  \njostling, baiting each other to keep awake,  \nshouting back and forth—no napping on the job,  \nnot this time. And so the hours dragged by  \nuntil the sun stood dead above our heads,  \na huge white ball in the noon sky, beating,  \nblazing down, and then it happened—  \nsuddenly, a whirlwind!  \nTwisting a great dust-storm up from the earth,  \na black plague of the heavens, filling the plain,  \nripping the leaves off every tree in sight,  \nchoking the air and sky. We squinted hard  \nand took our whipping from the gods.  \nAnd after the storm passed—it seemed endless—  \nthere, we saw the girl!  \nAnd she cried out a sharp, piercing cry,  \nlike a bird come back to an empty nest,  \npeering into its bed, and all the babies gone ...  \nJust so, when she sees the corpse bare  \nshe bursts into a long, shattering wail  \nand calls down withering curses on the heads  \nof all who did the work. And she scoops up dry dust,  \nhandfuls, quickly, and lifting a fine bronze urn,  \nlifting it high and pouring, she crowns the dead  \nwith three full libations.  \nSoon as we saw  \nwe rushed her, closed on the kill like hunters,  \nand she, she didn't flinch. We interrogated her,  \ncharging her with offenses past and present—  \nshe stood up to it all, denied nothing. I tell you,  \nit made me ache and laugh in the same breath.  \nIt's pure joy to escape the worst yourself,  \nit hurts a man to bring down his friends.  \nBut all that, I'm afraid, means less to me  \nthan my own skin. That's the way I'm made.\n\n**CREON:**  \nYou,\n\n*Wheeling on ANTIGONE.*\n\nwith your eyes fixed on the ground—speak up.  \nDo you deny you did this, yes or no?\n\n**ANTIGONE:**  \nI did it. I don't deny a thing.\n\n**CREON:**  \n*To the SENTRY.*  \nYou, get out, wherever you please—  \nyou're clear of a very heavy charge.\n\n*He leaves; CREON turns back to ANTIGONE.*\n\nYou, tell me briefly, no long speeches—  \nwere you aware a decree had forbidden this?\n\n**ANTIGONE:**  \nWell aware. How could I avoid it? It was public.\n\n**CREON:**  \nAnd still you had the gall to break this law?\n\n**ANTIGONE:**  \nOf course I did. It wasn't Zeus, not in the least,  \nwho made this proclamation—not to me.  \nNor did that Justice, dwelling with the gods  \nbeneath the earth, ordain such laws for men.  \nNor did I think your edict had such force  \nthat you, a mere mortal, could override the gods,  \nthe great unwritten, unshakable traditions.  \nThey are alive, not just today or yesterday:  \nthey live forever, from the first of time,  \nand no one knows when they first saw the light.  \nThese laws—I was not about to break them,  \nnot out of fear of some man's wounded pride,  \nand face the retribution of the gods.  \nDie I must, I've known it all my life—  \nhow could I keep from knowing?—even without  \nyour death-sentence ringing in my ears.  \nAnd if I am to die before my time  \nI consider that a gain. Who on earth,  \nalive in the midst of so much grief as I,  \ncould fail to find his death a rich reward?  \nSo for me, at least, to meet this doom of yours  \nis precious little pain. But if I had allowed  \nmy own mother's son to rot, an unburied corpse—  \nthat would have been an agony! This is nothing.  \nAnd if my present actions strike you as foolish,  \nlet's just say I've been accused of folly  \nby a fool.\n\n**LEADER:**  \nLike father like daughter,  \npassionate, wild ...  \nshe hasn't learned to bend before adversity.\n\n**CREON:**  \nNo? Believe me, the stiffest stubborn wills  \nfall the hardest; the toughest iron,  \ntempered strong in the white-hot fire,  \nyou'll see it crack and shatter first of all.  \nAnd I've known spirited horses you can break  \nwith a light bit—proud, rebellious horses.  \nThere's no room for pride, not in a slave,  \nnot with the lord and master standing by.  \nThis girl was an old hand at insolence  \nwhen she overrode the edicts we made public.  \nBut once she had done it—the insolence,  \ntwice over—to glory in it, laughing,  \nmocking us to our face with what she'd done.  \nI am not the man, not now: she is the man  \nif this victory goes to her and she goes free.  \nNever! Sister's child or closer in blood  \nthan all my family clustered at my altar  \nworshiping Guardian Zeus—she'll never escape,  \nshe and her blood sister, the most barbaric death.  \nYes, I accuse her sister of an equal part  \nin scheming this, this burial.\n\n*To his attendants.*\n\nBring her here!  \nI just saw her inside, hysterical, gone to pieces.  \nIt never fails: the mind convicts itself  \nin advance, when scoundrels are up to no good,  \nplotting in the dark. Oh but I hate it more  \nwhen a traitor, caught red-handed,  \ntries to glorify his crimes.\n\n**ANTIGONE:**  \nCreon, what more do you want  \nthan my arrest and execution?\n\n**CREON:**  \nNothing. Then I have it all.\n\n**ANTIGONE:**  \nThen why delay? Your moralizing repels me,  \nevery word you say—pray god it always will.  \nSo naturally all I say repels you too.  \nEnough.  \nGive me glory! What greater glory could I win  \nthan to give my own brother decent burial?  \nThese citizens here would all agree,\n\n*To the CHORUS.*\n\nthey would praise me too  \nif their lips weren't locked in fear.\n\n*Pointing to CREON.*\n\nLucky tyrants—the perquisites of power! Ruthless power to do and say  \nwhatever pleases them.\n\n**CREON:**  \nYou alone, of all the people in Thebes,  \nsee things that way.\n\n**ANTIGONE:**  \nThey see it just that way  \nbut defer to you and keep their tongues in leash.\n\n**CREON:**  \nAnd you, aren't you ashamed to differ so from them?  \nSo disloyal!\n\n**ANTIGONE:**  \nNot ashamed for a moment,  \nnot to honor my brother, my own flesh and blood.\n\n**CREON:**  \nWasn't Eteocles a brother too—cut down, facing him?\n\n**ANTIGONE:**  \nBrother, yes, by the same mother, the same father.\n\n**CREON:**  \nThen how can you render his enemy such honors,  \nsuch impieties in his eyes?\n\n**ANTIGONE:**  \nHe will never testify to that,  \nEteocles dead and buried.\n\n**CREON:**  \nHe will—  \nif you honor the traitor just as much as him.\n\n**ANTIGONE:**  \nBut it was his brother, not some slave that died—\n\n**CREON:**  \nRavaging our country!—  \nbut Eteocles died fighting in our behalf.\n\n**ANTIGONE:**  \nNo matter—Death longs for the same rites for all.\n\n**CREON:**  \nNever the same for the patriot and the traitor.\n\n**ANTIGONE:**  \nWho, Creon, who on earth can say the ones below  \ndon't find this pure and uncorrupt?\n\n**CREON:**  \nNever. Once an enemy, never a friend,  \nnot even after death.\n\n**ANTIGONE:**  \nI was born to join in love, not hate—  \nthat is my nature.\n\n**CREON:**  \nGo down below and love,  \nif love you must—love the dead! While I'm alive,  \nno woman is going to lord it over me.\n\n*Enter ISMENE from the palace, under guard.*\n\n**CHORUS:**  \nLook,  \nIsmene's coming, weeping a sister's tears,  \nloving sister, under a cloud ...  \nher face is flushed, her cheeks streaming.  \nSorrow puts her lovely radiance in the dark.\n\n**CREON:**  \nYou—  \nin my own house, you viper, slinking undetected,  \nsucking my life-blood! I never knew  \nI was breeding twin disasters, the two of you  \nrising up against my throne. Come, tell me,  \nwill you confess your part in the crime or not?  \nAnswer me. Swear to me.\n\n**ISMENE:**  \nI did it, yes—  \nif only she consents—I share the guilt,  \nthe consequences too.\n\n**ANTIGONE:**  \nNo,  \nJustice will never suffer that—not you,  \nyou were unwilling. I never brought you in.\n\n**ISMENE:**  \nBut now you face such dangers ... I'm not ashamed  \nto sail through trouble with you,  \nmake your troubles mine.\n\n**ANTIGONE:**  \nWho did the work?  \nLet the dead and the god of death bear witness!  \nI have no love for a friend who loves in words alone.\n\n**ISMENE:**  \nOh no, my sister, don't reject me, please,  \nlet me die beside you, consecrating  \nthe dead together.\n\n**ANTIGONE:**  \nNever share my dying,  \ndon't lay claim to what you never touched.  \nMy death will be enough.\n\n**ISMENE:**  \nWhat do I care for life, cut off from you?\n\n**ANTIGONE:**  \nAsk Creon. Your concern is all for him.\n\n**ISMENE:**  \nWhy abuse me so? It doesn't help you now.\n\n**ANTIGONE:**  \nYou're right—  \nif I mock you, I get no pleasure from it,  \nonly pain.\n\n**ISMENE:**  \nTell me, dear one,  \nwhat can I do to help you, even now?\n\n**ANTIGONE:**  \nSave yourself. I don't grudge you your survival.\n\n**ISMENE:**  \nOh no, no, denied my portion in your death?\n\n**ANTIGONE:**  \nYou chose to live, I chose to die.\n\n**ISMENE:**  \nNot, at least,  \nwithout every kind of caution I could voice.\n\n**ANTIGONE:**  \nYour wisdom appealed to one world—mine, another.\n\n**ISMENE:**  \nBut look, we're both guilty, both condemned to death.\n\n**ANTIGONE:**  \nCourage! Live your life. I gave myself to death,  \nlong ago, so I might serve the dead.\n\n**CREON:**  \nThey're both mad, I tell you, the two of them.  \nOne's just shown it, the other's been that way  \nsince she was born.\n\n**ISMENE:**  \nTrue, my king,  \nthe sense we were born with cannot last forever ...  \ncommit cruelty on a person long enough  \nand the mind begins to go.\n\n**CREON:**  \nYours did,  \nwhen you chose to commit your crimes with her.\n\n**ISMENE:**  \nHow can I live alone, without her?\n\n**CREON:**  \nHer?  \nDon't even mention her—she no longer exists.\n\n**ISMENE:**  \nWhat? You'd kill your own son's bride?\n\n**CREON:**  \nAbsolutely:  \nthere are other fields for him to plow.\n\n**ISMENE:**  \nPerhaps,  \nbut never as true, as close a bond as theirs.\n\n**CREON:**  \nA worthless woman for my son? It repels me.\n\n**ISMENE:**  \nDearest Haemon, your father wrongs you so!\n\n**CREON:**  \nEnough, enough—you and your talk of marriage!\n\n---\n\n**ISMENE:**  \nCreon—you're really going to rob your son of Antigone?\n\n**CREON:**  \nDeath will do it for me—break their marriage off.\n\n**LEADER:**  \nSo, it's settled then? Antigone must die?\n\n**CREON:**  \nSettled, yes—we both know that.\n\n*To the guards.*\n\nStop wasting time. Take them in.  \nFrom now on they'll act like women.  \nTie them up, no more running loose;  \neven the bravest will cut and run,  \nonce they see Death coming for their lives.\n\n*The guards escort ANTIGONE and ISMENE into the palace. CREON remains while the old citizens form their CHORUS.*\n\n**CHORUS:**  \nBlest, they are the truly blest who all their lives  \nhave never tasted devastation. For others, once  \nthe gods have rocked a house to its foundations  \nthe ruin will never cease, cresting on and on  \nfrom one generation on throughout the race—  \nlike a great mounting tide  \ndriven on by savage northern gales,  \nsurging over the dead black depths  \nroiling up from the bottom dark heaves of sand  \nand the headlands, taking the storm's onslaught full-force,  \nroar, and the low moaning  \nechoes on and on  \nand now  \nas in ancient times I see the sorrows of the house,  \nthe living heirs of the old ancestral kings,  \npiling on the sorrows of the dead  \nand one generation cannot free the next—  \nsome god will bring them crashing down,  \nthe race finds no release.  \nAnd now the light, the hope  \nspringing up from the late last root  \nin the house of Oedipus, that hope's cut down in turn  \nby the long, bloody knife swung by the gods of death  \nby a senseless word  \nby fury at the heart.  \nZeus,  \nyours is the power, Zeus, what man on earth  \ncan override it, who can hold it back?  \nPower that neither Sleep, the all-ensnaring  \nno, nor the tireless months of heaven  \ncan ever overmaster—young through all time,  \nmighty lord of power, you hold fast  \nthe dazzling crystal mansions of Olympus.  \nAnd throughout the future, late and soon  \nas through the past, your law prevails:  \nno towering form of greatness  \nenters into the lives of mortals  \nfree and clear of ruin.  \nTrue,  \nour dreams, our high hopes voyaging far and wide  \nbring sheer delight to many, to many others  \ndelusion, blithe, mindless lusts  \nand the fraud steals on one slowly  \nunaware  \ntill he trips and puts his foot into the fire.  \nHe was a wise old man who coined  \nthe famous saying: \"Sooner or later  \nfoul is fair, fair is foul  \nto the man the gods will ruin\"—  \nHe goes his way for a moment only  \nfree of blinding ruin.\n\n*Enter HAEMON from the palace.*\n\nHere's Haemon now, the last of all your sons.  \nDoes he come in tears for his bride,  \nhis doomed bride, Antigone—  \nbitter at being cheated of their marriage?\n\n**CREON:**  \nWe'll soon know, better than seers could tell us.\n\n*Turning to HAEMON.*\n\nSon, you've heard the final verdict on your bride?  \nAre you coming now, raving against your father?  \nOr do you love me, no matter what I do?\n\n**HAEMON:**  \nFather, I'm your son ...  \nyou in your wisdom  \nset my bearings for me—I obey you.  \nNo marriage could ever mean more to me than you,  \nwhatever good direction you may offer.\n\n**CREON:**  \nFine, Haemon.  \nThat's how you ought to feel within your heart,  \nsubordinate to your father's will in every way.  \nThat's what a man prays for: to produce good sons—  \na household full of them, dutiful and attentive,  \nso they can pay his enemy back with interest  \nand match the respect their father shows his friend.  \nBut the man who rears a brood of useless children,  \nwhat has he brought into the world, I ask you?  \nNothing but trouble for himself, and mockery  \nfrom his enemies laughing in his face.  \nOh Haemon,  \nnever lose your sense of judgment over a woman.  \nThe warmth, the rush of pleasure, it all goes cold  \nin your arms, I warn you ... a worthless woman  \nin your house, a misery in your bed.  \nWhat wound cuts deeper than a loved one  \nturned against you? Spit her out,  \nlike a mortal enemy—let the girl go.  \nLet her find a husband down among the dead.  \nImagine it: I caught her in naked rebellion,  \nthe traitor, the only one in the whole city.  \nI'm not about to prove myself a liar,  \nnot to my people, no, I'm going to kill her!  \nThat's right—so let her cry for mercy, sing her hymns  \nto Zeus who defends all bonds of kindred blood.  \nWhy, if I bring up my own kin to be rebels,  \nthink what I'd suffer from the world at large.  \nShow me the man who rules his household well:  \nI'll show you someone fit to rule the state.  \nThat good man, my son,  \nI have every confidence he and he alone  \ncan give commands and take them too. Staunch  \nin the storm of spears he'll stand his ground,  \na loyal, unflinching comrade at your side.  \nBut whoever steps out of line, violates the laws  \nor presumes to hand out orders to his superiors,  \nhe'll win no praise from me. But that man  \nthe city places in authority, his orders  \nmust be obeyed, large and small,  \nright and wrong.  \nAnarchy—  \nshow me a greater crime in all the earth!  \nShe, she destroys cities, rips up houses,  \nbreaks the ranks of spearmen into headlong rout.  \nBut the ones who last it out, the great mass of them  \nowe their lives to discipline. Therefore  \nwe must defend the men who live by law,  \nnever let some woman triumph over us.  \nBetter to fall from power, if fall we must,  \nat the hands of a man—never be rated  \ninferior to a woman, never.\n\n**LEADER:**  \nTo us,  \nunless old age has robbed us of our wits,  \nyou seem to say what you have to say with sense.\n\n**HAEMON:**  \nFather, only the gods endow a man with reason,  \nthe finest of all their gifts, a treasure.  \nFar be it from me—I haven't the skill,  \nand certainly no desire, to tell you when,  \nif ever, you make a slip in speech ... though  \nsomeone else might have a good suggestion.  \nOf course it's not for you,  \nin the normal run of things, to watch  \nwhatever men say or do, or find to criticize.  \nThe man in the street, you know, dreads your glance,  \nhe'd never say anything displeasing to your face.  \nBut it's for me to catch the murmurs in the dark,  \nthe way the city mourns for this young girl.  \n\"No woman,\" they say, \"ever deserved death less,  \nand such a brutal death for such a glorious action.  \nShe, with her own dear brother lying in his blood—  \nshe couldn't bear to leave him dead, unburied,  \nfood for the wild dogs or wheeling vultures.  \nDeath? She deserves a glowing crown of gold!\"  \nSo they say, and the rumor spreads in secret,  \ndarkly ...  \nI rejoice in your success, father—  \nnothing more precious to me in the world.  \nWhat medal of honor brighter to his children  \nthan a father's growing glory? Or a child's  \nto his proud father? Now don't, please,  \nbe quite so single-minded, self-involved,  \nor assume the world is wrong and you are right.  \nWhoever thinks that he alone possesses intelligence,  \nthe gift of eloquence, he and no one else,  \nand character too ... such men, I tell you,  \nspread them open—you will find them empty.  \nNo,  \nit's no disgrace for a man, even a wise man,  \nto learn many things and not to be too rigid.  \nYou've seen trees by a raging winter torrent,  \nhow many sway with the flood and salvage every twig,  \nbut not the stubborn—they're ripped out, roots and all.  \nBend or break. The same when a man is sailing:  \nhaul your sheets too taut, never give an inch,  \nyou'll capsize, and go the rest of the voyage  \nkeel up and the rowing-benches under.  \nOh give way. Relax your anger—change!  \nI'm young, I know, but let me offer this:  \nit would be best by far, I admit,  \nif a man were born infallible, right by nature.  \nIf not—and things don't often go that way,  \nit's best to learn from those with good advice.\n\n**LEADER:**  \nYou'd do well, my lord, if he's speaking to the point,  \nto learn from him,\n\n*Turning to HAEMON.*\n\nand you, my boy, from him.  \nYou both are talking sense.\n\n**CREON:**  \nSo,  \nmen our age, we're to be lectured, are we?—  \nschooled by a boy his age?\n\n**HAEMON:**  \nOnly in what is right. But if I seem young,  \nlook less to my years and more to what I do.\n\n**CREON:**  \nDo? Is admiring rebels an achievement?\n\n**HAEMON:**  \nI'd never suggest that you admire treason.\n\n**CREON:**  \nOh?—  \nisn't that just the sickness that's attacked her?\n\n**HAEMON:**  \nThe whole city of Thebes denies it, to a man.\n\n**CREON:**  \nAnd is Thebes about to tell me how to rule?\n\n**HAEMON:**  \nNow, you see? Who's talking like a child?\n\n**CREON:**  \nAm I to rule this land for others or myself?\n\n**HAEMON:**  \nIt's no city at all, owned by one man alone.\n\n**CREON:**  \nWhat? The city is the king's—that's the law!\n\n**HAEMON:**  \nWhat a splendid king you'd make of a desert island—  \nyou and you alone.\n\n**CREON:**  \n*To the CHORUS.*  \nThis boy, I do believe,  \nis fighting on her side, the woman's side.\n\n**HAEMON:**  \nIf you are a woman, yes—  \nmy concern is all for you.\n\n**CREON:**  \nWhy, you degenerate—bandying accusations,  \nthreatening me with justice, your own father!\n\n**HAEMON:**  \nI see my father offending justice—wrong.\n\n**CREON:**  \nWrong?  \nTo protect my royal rights?\n\n**HAEMON:**  \nProtect your rights?  \nWhen you trample down the honors of the gods?\n\n**CREON:**  \nYou, you soul of corruption, rotten through—  \nwoman's accomplice!\n\n**HAEMON:**  \nThat may be,  \nbut you will never find me accomplice to a criminal.\n\n**CREON:**  \nThat's what she is,  \nand every word you say is a blatant appeal for her—\n\n**HAEMON:**  \nAnd you, and me, and the gods beneath the earth.\n\n**CREON:**  \nYou will never marry her, not while she's alive.\n\n**HAEMON:**  \nThen she will die ... but her death will kill another.\n\n**CREON:**  \nWhat, brazen threats? You go too far!\n\n**HAEMON:**  \nWhat threat?  \nCombating your empty, mindless judgments with a word?\n\n**CREON:**  \nYou'll suffer for your sermons, you and your empty wisdom!\n\n**HAEMON:**  \nIf you weren't my father, I'd say you were insane.\n\n**CREON:**  \nDon't flatter me with *Father*—you woman's slave!\n\n**HAEMON:**  \nYou really expect to fling abuse at me  \nand not receive the same?\n\n**CREON:**  \nIs that so!  \nNow, by heaven, I promise you, you'll pay—  \ntaunting, insulting me! Bring her out,  \nthat hateful—she'll die now, here,  \nin front of his eyes, beside her groom!\n\n**HAEMON:**  \nNo, no, she will never die beside me—  \ndon't delude yourself. And you will never  \nsee me, never set eyes on my face again.  \nRage your heart out, rage with friends  \nwho can stand the sight of you.\n\n*Rushing out.*\n\n**LEADER:**  \nGone, my king, in a burst of anger.  \nA temper young as his ... hurt him once,  \nhe may do something violent.\n\n**CREON:**  \nLet him do—  \ndream up something desperate, past all human limit!  \nGood riddance. Rest assured,  \n
